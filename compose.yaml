services:
  emergence-lab:
    build: .
    cpus: 0.5
    mem_limit: 1536m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      GIT_SHA: "${GIT_SHA:-unknown}"
    volumes:
      - ./results:/results
    command: ["--config", "configs/nightly.json", "--output", "/results"]
    restart: "no"
