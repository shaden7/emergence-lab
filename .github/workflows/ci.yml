name: Test and smoke experiment
on:
  push:
    # Lease commits are coordination state, not code. Note: a push workflow is read from the
    # pushed commit, so this only helps once the lock branch carries this file or none at all.
    branches-ignore:
      - coordination/research-lock
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: emergence-lab --config configs/smoke.json --output results
      - name: Exact 4x4 reference holdout
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          emergence-lab --config configs/exact4_validation.json --output results/exact4
          python -m emergence_lab.exact4 --config configs/exact4_validation.json --results results/exact4
      - name: Pre-registered M4 interval coverage audit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/exact4-coverage-pilot-20261009'
        timeout-minutes: 20
        run: |
          python -m emergence_lab.coverage4 --config configs/exact4_coverage_pilot.json --output results/exact4_coverage.json
      - name: Pre-registered paired burn-in sensitivity pilot
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/exact4-burnin-sensitivity-20261009'
        timeout-minutes: 20
        run: |
          python -m emergence_lab.burnin4 --config configs/exact4_burnin_sensitivity.json --output results/exact4_burnin.json
      # Heavy fixed-seed pilots already have archived CI runs; rerun only by explicit dispatch.
      - name: Bounded phase-0 finite-size and J=0 pilot
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/phase0-director-audit-20261009' || github.ref == 'refs/heads/main')
        timeout-minutes: 5
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m emergence_lab.finite_size --config configs/fss_pilot.json --output results/finite_size_pilot.json
          python scripts/autocorr_synthetic_audit.py --output results/autocorr_synthetic.json
          python -m emergence_lab.equilibration4 --config configs/equilibration4_pilot.json --output results/equilibration4_pilot.json
          python -m emergence_lab.mixing_pilot --config configs/mixing_pilot.json --output results/mixing_pilot.json
          python scripts/mixing_diagnostics.py --mixing-json results/mixing_pilot.json --output results/mixing_diagnostics.json
          python -m emergence_lab.ising_1d_control --config configs/ising_1d_control.json --output results/ising_1d_control.json
          python -m emergence_lab.ising_1d_control --config configs/ising_1d_anomaly_followup.json --output results/ising_1d_anomaly_followup.json
      - name: Preregistered L32 critical-mixing gate
        # TEMPORARY push condition for one independent runner execution (dispatch is unavailable to the
        # review integration); removed again before merge.
        if: (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/l32-critical-gate-20261010' || github.ref == 'refs/heads/main')) || (github.event_name == 'push' && github.ref == 'refs/heads/research/l32-critical-gate-20261010')
        timeout-minutes: 20
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m emergence_lab.critical_gate --config configs/l32_critical_gate.json --output results/l32_critical_gate.json --workers 2
          # Surface key evidence as check annotations (readable via the REST API without log/artifact access).
          python -c "import json; r=json.load(open('results/l32_critical_gate.json')); m=r['main']; o=m['observables']; print('::notice title=L32 gate raw::npz_sha256=' + r['raw_npz_sha256'] + ' python=' + r['environment']['python'] + ' numpy=' + r['environment']['numpy'] + ' commit=' + str(r['environment']['commit'])); print('::notice title=L32 gate result::gate_pass=%s E=%r rhatE=%r essminE=%r cover=%d absm=%r rhatM=%r essminM=%r power_control_G3_pass=%s' % (m['gate_pass'], o['energy']['pooled_mean'], o['energy']['rhat_max'], o['energy']['chain_ess_min'], o['energy']['chains_covering_exact'], o['abs_magnetization']['pooled_mean'], o['abs_magnetization']['rhat_max'], o['abs_magnetization']['chain_ess_min'], r['power_control']['checks']['G3_chain_ess_abs_magnetization']))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
