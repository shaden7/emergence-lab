name: Test and smoke experiment
on:
  push:
    # Lease commits are coordination state, not code. Note: a push workflow is read from the
    # pushed commit, so this only helps once the lock branch carries this file or none at all.
    branches-ignore:
      - coordination/research-lock
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: emergence-lab --config configs/smoke.json --output results
      - name: Exact 4x4 reference holdout
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          emergence-lab --config configs/exact4_validation.json --output results/exact4
          python -m emergence_lab.exact4 --config configs/exact4_validation.json --results results/exact4
      # Small, frozen development-fixture noise audit; the original holdout is never rerun.
      - name: Preregistered Pilot A N5 measurement-noise stress
        timeout-minutes: 2
        env:
          GIT_SHA: ${{ github.sha }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python -m emergence_lab.pilot_a_noise --config configs/pilot_a_n5.json --output results/pilot_a_n5
      # Pilot B stage 1: dev key only (labels public). The blind key does not exist yet.
      - name: Pilot B stage-1 development set (twice, byte-identical)
        timeout-minutes: 3
        env:
          GIT_SHA: ${{ github.sha }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python -m emergence_lab.pilot_b --phase dev --output results/pilot_b_dev
          python -m emergence_lab.pilot_b --phase dev --output results/pilot_b_dev_repeat
          cmp results/pilot_b_dev/rows.csv results/pilot_b_dev_repeat/rows.csv
          cmp results/pilot_b_dev/result.json results/pilot_b_dev_repeat/result.json
          python -c "import json; m=json.load(open('results/pilot_b_dev/manifest.json')); print('::notice title=Pilot B dev::' + json.dumps(m['outputs']) + ' decisions_sha256=' + m['decisions_sha256'] + ' gates_pass=' + str(m['gates_pass_B_G0_to_G5']) + ' cpu=' + str(m['cpu_seconds']) + ' python=' + m['python'] + ' numpy=' + m['numpy'])"
      # D1 (Issue #4): deterministic lattice part only (D-G0/D-G1, no random graph), twice, byte-identical.
      - name: D1 dimension estimator lattice exactness (D-G0/D-G1, twice)
        timeout-minutes: 3
        env:
          GIT_SHA: ${{ github.sha }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python -m emergence_lab.dimension_d1 --families lattices --output results/d1_lattices > /dev/null
          python -m emergence_lab.dimension_d1 --families lattices --output results/d1_lattices_repeat > /dev/null
          cmp results/d1_lattices/ball_counts.csv results/d1_lattices_repeat/ball_counts.csv
          cmp results/d1_lattices/result.json results/d1_lattices_repeat/result.json
          python -c "import json; m=json.load(open('results/d1_lattices/manifest.json')); assert all(m['gates_pass'].values()), m['gates_pass']; print('::notice title=D1 lattices::' + json.dumps(m['gates_pass']) + ' ' + json.dumps(m['outputs']) + ' peak_rss_mib=' + str(m['peak_rss_mib']))"
      # The D1 full preregistered grid runs only in .github/workflows/d1-full-grid.yml (dispatch, main),
      # so that dispatching it does not rerun the main-gated Phase-0 steps below.
      - name: Pre-registered M4 interval coverage audit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/exact4-coverage-pilot-20261009'
        timeout-minutes: 20
        run: |
          python -m emergence_lab.coverage4 --config configs/exact4_coverage_pilot.json --output results/exact4_coverage.json
      - name: Pre-registered paired burn-in sensitivity pilot
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/exact4-burnin-sensitivity-20261009'
        timeout-minutes: 20
        run: |
          python -m emergence_lab.burnin4 --config configs/exact4_burnin_sensitivity.json --output results/exact4_burnin.json
      # Heavy fixed-seed pilots already have archived CI runs; rerun only by explicit dispatch.
      - name: Bounded phase-0 finite-size and J=0 pilot
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/phase0-director-audit-20261009' || github.ref == 'refs/heads/main')
        timeout-minutes: 5
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m emergence_lab.finite_size --config configs/fss_pilot.json --output results/finite_size_pilot.json
          python scripts/autocorr_synthetic_audit.py --output results/autocorr_synthetic.json
          python -m emergence_lab.equilibration4 --config configs/equilibration4_pilot.json --output results/equilibration4_pilot.json
          python -m emergence_lab.mixing_pilot --config configs/mixing_pilot.json --output results/mixing_pilot.json
          python scripts/mixing_diagnostics.py --mixing-json results/mixing_pilot.json --output results/mixing_diagnostics.json
          python -m emergence_lab.ising_1d_control --config configs/ising_1d_control.json --output results/ising_1d_control.json
          python -m emergence_lab.ising_1d_control --config configs/ising_1d_anomaly_followup.json --output results/ising_1d_anomaly_followup.json
      - name: Preregistered L32 critical-mixing gate
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/l32-critical-gate-20261010' || github.ref == 'refs/heads/main')
        timeout-minutes: 20
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m emergence_lab.critical_gate --config configs/l32_critical_gate.json --output results/l32_critical_gate.json --workers 2
          # Surface key evidence as check annotations (readable via the REST API without log/artifact access).
          python -c "import json; r=json.load(open('results/l32_critical_gate.json')); m=r['main']; o=m['observables']; print('::notice title=L32 gate raw::npz_sha256=' + r['raw_npz_sha256'] + ' python=' + r['environment']['python'] + ' numpy=' + r['environment']['numpy'] + ' commit=' + str(r['environment']['commit'])); print('::notice title=L32 gate result::gate_pass=%s E=%r rhatE=%r essminE=%r cover=%d absm=%r rhatM=%r essminM=%r power_control_G3_pass=%s' % (m['gate_pass'], o['energy']['pooled_mean'], o['energy']['rhat_max'], o['energy']['chain_ess_min'], o['energy']['chains_covering_exact'], o['abs_magnetization']['pooled_mean'], o['abs_magnetization']['rhat_max'], o['abs_magnetization']['chain_ess_min'], r['power_control']['checks']['G3_chain_ess_abs_magnetization']))"
      - name: Preregistered 4x4 burn-in replication
        # Executed on the preregistration commit via a temporary push trigger (runs 38037948647, 38038206636); dispatch only now.
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/burnin-replication-20261010' || github.ref == 'refs/heads/main')
        timeout-minutes: 10
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python -m emergence_lab.burnin_replication --config configs/exact4_burnin_replication.json --output results/burnin_replication.json | tee results/burnin_replication.txt
          python -c "import json; r=json.load(open('results/burnin_replication.json')); print('::notice title=Burn-in replication raw::' + ' '.join('%s=%s' % kv for kv in r['raw_digests'].items()) + ' python=' + r['environment']['python'] + ' numpy=' + r['environment']['numpy']); [print('::notice title=Burn-in %s::mean=%r se=%r t=%r p=%r verdict=%s' % (p['id'], p['mean'], p['stderr'], p['t'], p['p'], p['verdict'])) for p in r['analysis']['primary']]"
      # S1 (Issue #37): P0a-P0d engineering gates only, engineering seed base; no pilot seed drawn.
      - name: S1 spectral P0 engineering gates (P0a-P0d)
        timeout-minutes: 5
        env:
          GIT_SHA: ${{ github.sha }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python -m emergence_lab.spectral_s1 --output results/spectral_s1_p0.json
          python -c "import json; r=json.load(open('results/spectral_s1_p0.json')); print('::notice title=S1 P0::' + json.dumps({k: r[k]['pass'] for k in ('P0a','P0b','P0c','P0d')}) + ' p0a_max_err=' + json.dumps({n: c['max_abs_error'] for n, c in r['P0a']['cases'].items()}) + ' p0d_sha=' + r['P0d']['csv_sha256'][0] + ' python=' + r['manifest']['python'] + ' numpy=' + r['manifest']['numpy'])"
      - name: Preregistered many-batch coverage gate (report gate 4)
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/coverage-gate-20261010' || github.ref == 'refs/heads/main')
        timeout-minutes: 45
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m emergence_lab.coverage_gate --config configs/coverage_gate.json --output results/coverage_gate.json --workers 4 | tee results/coverage_gate.txt
          python -c "import json; r=json.load(open('results/coverage_gate.json')); print('::notice title=Coverage gate raw::npz_sha256=' + r['raw_npz_sha256'] + ' python=' + r['environment']['python'] + ' numpy=' + r['environment']['numpy'] + ' commit=' + str(r['environment']['commit'])); [print('::notice title=Coverage gate L%s::covered=%d/%d wilson95=%r bias_z=%r per_chain=%d pass=%s control_covered=%d control_pass=%s' % (L, s['main']['energy']['covered'], s['main']['energy']['batches'], s['main']['energy']['wilson95'], s['main']['bias_z'], s['main']['per_chain_energy']['covered'], s['main']['pass'], s['power_control']['energy']['covered'], s['power_control']['pass'])) for L, s in r['sizes'].items()]; print('::notice title=Coverage gate::gate_pass=%s' % r['gate_pass'])"
      - name: Preregistered finite-size gate (report gate 5)
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/research/finite-size-gate-20261010' || github.ref == 'refs/heads/main')
        timeout-minutes: 60
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m emergence_lab.finite_size_gate --config configs/finite_size_gate.json --output results/finite_size_gate.json --workers 4 | tee results/finite_size_gate.txt
          python -c "import json; r=json.load(open('results/finite_size_gate.json')); print('::notice title=FSS gate raw::npz_sha256=' + r['raw_npz_sha256'] + ' python=' + r['environment']['python'] + ' numpy=' + r['environment']['numpy'] + ' commit=' + str(r['environment']['commit'])); [print('::notice title=FSS gate %s::%s' % (w, json.dumps({k: [v['estimate'], v['pass']] for k, v in f.items()}))) for w, f in r['main']['fits'].items()]; print('::notice title=FSS gate::gate_pass=%s failed=%s' % (r['gate_pass'], [k for k, v in r['main']['checks'].items() if not v]))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
