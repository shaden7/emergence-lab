name: Test and smoke experiment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: emergence-lab --config configs/smoke.json --output results
      - name: Exact 4x4 reference holdout
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          emergence-lab --config configs/exact4_validation.json --output results/exact4
          python -m emergence_lab.exact4 --config configs/exact4_validation.json --results results/exact4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
