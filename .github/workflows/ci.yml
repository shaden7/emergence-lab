name: Test and smoke experiment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: emergence-lab --config configs/smoke.json --output results
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/
