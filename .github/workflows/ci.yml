name: Test and smoke experiment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: emergence-lab --config configs/smoke.json --output results
      - name: Exact 4x4 reference holdout
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          emergence-lab --config configs/exact4_validation.json --output results/exact4
          python -m emergence_lab.exact4 --config configs/exact4_validation.json --results results/exact4
      - name: Pre-registered M4 interval coverage audit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/exact4-coverage-pilot-20261009'
        timeout-minutes: 20
        run: |
          python -m emergence_lab.coverage4 --config configs/exact4_coverage_pilot.json --output results/exact4_coverage.json
      - name: Pre-registered paired burn-in sensitivity pilot
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/exact4-burnin-sensitivity-20261009'
        timeout-minutes: 20
        run: |
          python -m emergence_lab.burnin4 --config configs/exact4_burnin_sensitivity.json --output results/exact4_burnin.json
      - name: Bounded phase-0 finite-size and J=0 pilot
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/phase0-director-audit-20261009'
        timeout-minutes: 5
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          python -m emergence_lab.finite_size --config configs/fss_pilot.json --output results/finite_size_pilot.json
          python scripts/autocorr_synthetic_audit.py --output results/autocorr_synthetic.json
          python -m emergence_lab.equilibration4 --config configs/equilibration4_pilot.json --output results/equilibration4_pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
